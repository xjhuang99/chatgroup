<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>… — xjhuang.com</title>
    <link rel="canonical" href="https://xjhuang.com/home">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Inter:wght@400;600&display=swap">
    <link rel="stylesheet" href="/static/theme.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Inter, sans-serif;
            min-height: 100vh;
            color: #e8eaf0;
            overflow-x: hidden;
        }

        .cosmos {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: linear-gradient(to bottom, #020208 0%, #050818 40%, #0a1028 70%, #030510 100%);
        }
        #starCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
        .milky-way {
            position: absolute;
            inset: -20% -10%;
            background: linear-gradient(
                118deg,
                transparent 28%,
                rgba(120, 140, 200, 0.06) 42%,
                rgba(180, 190, 230, 0.12) 50%,
                rgba(120, 140, 200, 0.06) 58%,
                transparent 72%
            );
            transform: rotate(-12deg);
            pointer-events: none;
        }
        .sky-glow {
            position: absolute;
            width: 70vmin;
            height: 70vmin;
            top: -15vmin;
            left: 50%;
            transform: translateX(-50%);
            background: radial-gradient(circle, rgba(60, 80, 160, 0.18) 0%, transparent 70%);
            pointer-events: none;
        }
        .cosmos .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 35%, rgba(0, 0, 0, 0.65) 100%);
            pointer-events: none;
        }

        .page {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 24px 72px;
        }

        .quote-block {
            max-width: 640px;
            text-align: center;
            animation: fadeUp 1.2s ease-out both;
        }
        .quote-block blockquote {
            font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
            font-size: clamp(1.65rem, 4.5vw, 2.35rem);
            font-weight: 400;
            line-height: 1.45;
            color: #f4f0e8;
            font-style: italic;
            letter-spacing: 0.02em;
            text-shadow: 0 2px 24px rgba(0,0,0,0.4);
        }

        .home-link {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 28px;
            z-index: 2;
            text-align: center;
            font-size: 0.75rem;
            color: rgba(200, 205, 220, 0.38);
            animation: fadeUp 1.6s ease-out 0.5s both;
        }
        .home-link a {
            color: inherit;
            text-decoration: none;
            font-weight: 400;
            letter-spacing: 0.04em;
        }
        .home-link a:hover {
            color: rgba(245, 200, 150, 0.7);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
<div class="cosmos" aria-hidden="true">
    <canvas id="starCanvas"></canvas>
    <div class="milky-way"></div>
    <div class="sky-glow"></div>
    <div class="vignette"></div>
</div>
<div class="page">
    <header class="quote-block">
        <blockquote>Wonder is the beginning of wisdom.</blockquote>
    </header>
</div>
<p class="home-link">
    <a href="/home">Take me to /home</a>
</p>
<script>
(function initStarfield() {
    const canvas = document.getElementById('starCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let stars = [];
    let w = 0;
    let h = 0;

    function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        stars = [];
        const count = Math.floor((w * h) / 2800);
        for (let i = 0; i < count; i++) {
            stars.push({
                x: Math.random() * w,
                y: Math.random() * h,
                r: Math.random() * 1.4 + 0.3,
                base: Math.random() * 0.5 + 0.35,
                twinkle: Math.random() * Math.PI * 2,
                speed: Math.random() * 0.015 + 0.004,
            });
        }
    }

    function draw(t) {
        ctx.clearRect(0, 0, w, h);
        for (const s of stars) {
            const flicker = 0.55 + 0.45 * Math.sin(t * s.speed + s.twinkle);
            const alpha = s.base * flicker;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
            ctx.fill();
            if (s.r > 1.1 && alpha > 0.7) {
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r * 2.2, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(200, 215, 255, ${alpha * 0.15})`;
                ctx.fill();
            }
        }
        requestAnimationFrame(draw);
    }

    resize();
    window.addEventListener('resize', resize);
    requestAnimationFrame(draw);
})();
</script>
</body>
</html>
